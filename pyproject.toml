[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hookrelay"
version = "0.1.0"
description = "Reliable webhook ingestion and delivery: signed intake, dedupe, async fan-out, backoff, circuit breaker, dead letters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Mahdy", email = "mahdy@progma.tech" }]
requires-python = ">=3.11"
keywords = ["webhooks", "fastapi", "celery", "circuit-breaker", "retry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "celery[redis]>=5.3",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/hookrelay"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # Optional[...] / datetime.timezone.utc are kept on purpose: SQLAlchemy and
    # Pydantic evaluate annotations at runtime and the code also runs on 3.9.
    "UP007", "UP045", "UP017", "UP006", "UP035", "UP042",
    "B008",  # FastAPI's Depends() in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["hookrelay"]
